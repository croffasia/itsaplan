version: 2
updates:
  # Dependabot resolves bun.lock for version updates only; advisories are caught
  # by the `bun audit` step in ci.yml. Tiptap packages pin each other's exact
  # version through peer dependencies, so they have to be bumped as one group.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    labels: ['dependencies']
    groups:
      tiptap:
        patterns: ['@tiptap/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ['dependencies', 'ci']

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /apps/worker
      - /apps/bot
    schedule:
      interval: weekly
    labels: ['dependencies', 'docker']
