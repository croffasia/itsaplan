apiVersion: v1
kind: Service
metadata:
  name: {{ include "itsaplan.fullname" . }}-api
  labels:
    {{- include "itsaplan.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP
      name: http
    # The worker and the bot call /internal/* here. Cluster-internal: no Ingress or
    # IngressRoute may point at it.
    - port: {{ .Values.api.internalPort }}
      targetPort: internal
      protocol: TCP
      name: internal
  selector:
    {{- include "itsaplan.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
