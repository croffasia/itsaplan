# VPS overlay for docker-compose.yml: Caddy in front with automatic HTTPS, and the
# api and web ports bound to the host's loopback only, so nothing but Caddy is
# reachable from the internet.
#
#   docker compose -f docker-compose.yml -f deploy/vps/docker-compose.vps.yml up -d --build
#
# Set APP_DOMAIN and API_DOMAIN in .env (see deploy/vps/env.vps.example).
services:
  api:
    ports: !override
      - '127.0.0.1:${API_PORT:-3000}:3000'
  web:
    ports: !override
      - '127.0.0.1:${WEB_PORT:-3001}:3001'
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api, web]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?the web app domain, e.g. plan.example.com}
      API_DOMAIN: ${API_DOMAIN:?the api domain, e.g. api.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
