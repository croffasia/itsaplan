acceptance:
  - id: A1
    source: brief.md
    text: With the Kanban subtask list enabled and Default collapsed off, WEEKUP-1's
      card shows WEEKUP-2 and WEEKUP-3 and their direct children by default.
      With Default collapsed on, the card's subtask list starts folded. After
      opening the card's subtask list, the children of WEEKUP-2 and WEEKUP-3 are
      folded until opened. Changing Default collapsed updates these initial
      states.
    result: passed
    reason:
      text: The focused default-folding test renders both branches, changes the
        setting, reopens the card header, and sees both children folded. It then
        restores the open default. The actual WEEKUP board showed WEEKUP-4 and
        WEEKUP-6 with Default collapsed off.
      truncated: false
  - id: A2
    source: brief.md
    text: Activating the progress count by pointer or keyboard folds or unfolds that
      row's own children without affecting its siblings. Levels deeper than the
      two shown by default start folded and use the same control when a count is
      displayed. A row with no progress count has no expand button.
    result: passed
    reason:
      text: The focused branch test checks independent toggles, a deeper branch that
        starts folded, and a leaf with no expand button. Chrome confirmed that
        clicking WEEKUP-2's count only collapsed its own branch and Enter
        reopened it.
      truncated: false
  - id: A3
    source: brief.md
    text: Clicking the title of a subtask or a displayed descendant opens that
      issue's details. Activating the progress button toggles its branch without
      opening an issue, selecting the card, or starting a drag.
    result: passed
    reason:
      text: The focused event test verifies that a count activation does not call the
        issue navigation or parent click and drag handlers. Clicking direct and
        deeper titles opens their issue. Both WEEKUP titles also opened the
        matching details in Chrome.
      truncated: false
