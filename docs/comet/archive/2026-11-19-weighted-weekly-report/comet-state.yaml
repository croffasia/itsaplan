                                    'source': 'brief.md',
                                    'text': 'A project administrator can bind valid issue types, compatible custom fields and an IANA time zone in project settings. Invalid or cross-project ID bindings are rejected, and project copies require rebinding. Native task forms still support the existing hierarchy and fields.',
                                  },
                                  {
                                    'id': 'A2',
                                    'source': 'brief.md',
                                    'text': 'In the internal preview, level-three weights `40/60` and rates `80/100` give `92%`. A level-one node with level-two weights `60/40` and rates `92/50` shows `75.2%`. The native counter still displays completed child counts.',
                                  },
                                  {
                                    'id': 'A3',
                                    'source': 'brief.md',
                                    'text': 'Missing or out-of-range values, sibling weights that fail to total `100%`, and absent children yield an unavailable calculation rather than a fabricated percentage. An unavailable contributing level-two result carries through to level one. A completed archived child still contributes its reported rate and weight.',
                                  },
                                  {
                                    'id': 'A4',
                                    'source': 'brief.md',
                                    'text': "With fictional tasks, earlier due dates trigger delay reporting in the configured time zone. Group an overdue level-two task's own reason and a direct level-three child's reason under level two, including children due before their parent. The day a task is due, unscheduled work, completed tasks and canceled tasks produce no delay line. A blank reason prompts review. Ordinary task updates can still save without a reason.",
