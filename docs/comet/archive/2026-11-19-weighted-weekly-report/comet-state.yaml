acceptance:
  - id: A1
    source: brief.md
    text: A project administrator can bind valid issue types, compatible custom
      fields and an IANA time zone in project settings. Invalid or cross-project
      ID bindings are rejected, and project copies require rebinding. Native
      task forms still support the existing hierarchy and fields.
    result: passed
    reason:
      text: Chrome project settings saved all eight bindings and Asia/Taipei, and
        reloading kept the values. API fixtures rejected a foreign field, a type
        mismatch, a duplicate type and an invalid zone, and the copied project
        required configuration. Native hierarchy and field regressions passed.
      truncated: false
  - id: A2
    source: brief.md
    text: In the internal preview, level-three weights `40/60` and rates `80/100`
      give `92%`. A level-one node with level-two weights `60/40` and rates
      `92/50` shows `75.2%`. The native counter still displays completed child
      counts.
    result: passed
    reason:
      text: Chrome and the API fixture showed exactly 92% and 50% for the level-two
        nodes and 75.2% for the aggregate. The native task and archived-child
        regressions passed with the existing counting behavior.
      truncated: false
  - id: A3
    source: brief.md
    text: Missing or out-of-range values, sibling weights that fail to total `100%`,
      and absent children yield an unavailable calculation rather than a
      fabricated percentage. An unavailable contributing level-two result
      carries through to level one. A completed archived child still contributes
      its reported rate and weight.
    result: passed
    reason:
      text: Unit and API checks rejected a stored weight total other than 100%,
        propagated a missing or out-of-range rate and preserved archived
        completed work. The read-only supplementary assertion checked the
        no-child and missing-value cases.
      truncated: false
  - id: A4
    source: brief.md
    text: With fictional tasks, earlier due dates trigger delay reporting in the
      configured time zone. Group an overdue level-two task's own reason and a
      direct level-three child's reason under level two, including children due
      before their parent. The day a task is due, unscheduled work, completed
      tasks and canceled tasks produce no delay line. A blank reason prompts
      review. Ordinary task updates can still save without a reason.
    result: passed
    reason:
      text: Chrome displayed only the two allowed reasons plus the missing-reason
        prompt. API and date-boundary checks covered due-today, missing due
        date, finished and canceled tasks, a late child of a parent due today,
        and an ordinary task update with no reason.
      truncated: false
  - id: A5
    source: brief.md
    text: From Docs, preview both progress levels internally and confirm a dated,
      locked, copyable Markdown document with only level-two titles, progress
      and reportable reasons. The document contains no generated level-three
      title, key or link. Enforce existing source task and Docs permissions on
      the routes. No public share token is generated.
    result: passed
    reason:
      text: Chrome generated and reopened locked Docs page 1 and the existing copy
        action confirmed success. The document contained two level-two rows and
        reasons, with no tertiary metadata or public token. API checks verified
        document history and project/work-item access.
      truncated: false
  - id: A6
    source: brief.md
    text: Concurrent and repeated saves within the same project/week resolve to one
      document without overwriting its content. A new week creates its own
      document and reflects changes since the prior week. Run the feature
      migration separately from the core journal and verify its unique key and
      document transaction.
    result: passed
    reason:
      text: Two concurrent confirmations returned one document, repeated reads kept
        its content, and the next week created a distinct page without the
        completed delay reason. A stale preview from the previous week was
        rejected. The feature migration recorded the unique project/week index
        separately.
      truncated: false
  - id: A7
    source: brief.md
    text: Verify the feature with fictional data on a local, isolated test instance
      while the v1.11.0 trial remains available on its existing ports and
      database. The sole checkout is the current project directory and the
      development branch is based on the v1.11.0 tag. Keep all changes local.
    result: passed
    reason:
      text: Only the current checkout and local development branch existed at v1.11.0.
        Fictional API and browser data used the separate loopback demo and test
        database. Original trial and demo both responded HTTP 200. No changes
        were committed or pushed.
      truncated: false
